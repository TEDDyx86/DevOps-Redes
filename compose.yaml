name: aularedes

x-platform: &platform
  image: aularedes-platform:local
  build: .
  restart: unless-stopped
  networks: [monitoring]
  security_opt: [no-new-privileges:true]

services:
  api:
    <<: *platform
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_URL: http://web-demo:8001
      DATABASE_PATH: /data/incidents.sqlite
      LAB_TOKEN: ${LAB_TOKEN:?Execute python scripts/configure.py}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Execute python scripts/configure.py}
      POSTGRES_MONITOR_DSN: postgresql://lab_monitor:${POSTGRES_MONITOR_PASSWORD:?Execute python scripts/configure.py}@postgres:5432/lab_network
      POSTGRES_WORKLOAD_DSN: postgresql://lab_workload:${POSTGRES_WORKLOAD_PASSWORD:?Execute python scripts/configure.py}@postgres:5432/lab_network
      DNS_SERVER: dns
      DNS_PORT: 1053
      SMTP_HOST: smtp
      SMTP_PORT: 2525
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_PASSWORD_HASH_FILE: /etc/aularedes/secrets/admin-password-hash
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CONFIG_WATCH_ROOT: /etc/aularedes/observed
      VULNERABILITY_REPORT_ROOT: /etc/aularedes/vulnerabilities
      RESOURCE_REPORT_ROOT: /etc/aularedes/resources
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - incidents:/data
      - ./.runtime/secrets/admin-password-hash:/etc/aularedes/secrets/admin-password-hash:ro
      - ./infra:/etc/aularedes/observed:ro
      - ./.runtime/vulnerabilities:/etc/aularedes/vulnerabilities:ro
      - ./.runtime/resources:/etc/aularedes/resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  web-demo:
    <<: *platform
    command: ["uvicorn", "demo.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      LAB_TOKEN: ${LAB_TOKEN:?Execute python scripts/configure.py}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Execute python scripts/configure.py}
      HTTP_CONFIG_FILE: /etc/aularedes/runtime/http.json
    volumes: ["./infra:/etc/aularedes/runtime:ro"]
    ports: ["127.0.0.1:8001:8001"]

  postgres:
    image: aularedes-postgres:17.11-gosu1.19-go1.27.3
    build: ./infra/postgres-image
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_DB: lab_network
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Execute python scripts/configure.py}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?Execute python scripts/configure.py}
      POSTGRES_WORKLOAD_PASSWORD: ${POSTGRES_WORKLOAD_PASSWORD:?Execute python scripts/configure.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-lab.sql:ro
      - ./infra/postgres:/etc/postgresql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d lab_network"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [monitoring]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  dns:
    image: coredns/coredns:1.15.0
    command: ["-conf", "/etc/coredns/Corefile"]
    user: "65532:65532"
    cap_drop: [ALL]
    # Official binary carries this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./infra/dns:/etc/coredns:ro
    networks: [monitoring]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  smtp:
    <<: *platform
    command: ["uvicorn", "demo.smtp_server:app", "--host", "0.0.0.0", "--port", "8027"]
    environment:
      SMTP_CONFIG_FILE: /etc/aularedes/runtime/smtp.json
    volumes:
      - smtp-data:/data
      - ./infra:/etc/aularedes/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import smtplib; s=smtplib.SMTP('127.0.0.1',2525,timeout=2); assert s.noop()[0]==250; s.quit()"]
      interval: 5s
      timeout: 4s
      retries: 12

  smtp-inbox:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 200
    volumes: ["smtp-mail:/data"]
    ports: ["127.0.0.1:8026:8025"]
    networks: [monitoring]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra:/etc/prometheus:ro
      - metrics:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra:/etc/alertmanager:ro
      - ./.runtime/secrets/webhook-token:/run/aularedes/webhook-token:ro
      - alerts:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [monitoring]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 200
    volumes: ["mail:/data"]
    ports: ["127.0.0.1:8025:8025"]
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  incidents:
  metrics:
  alerts:
  mail:
  postgres-data:
  smtp-data:
  smtp-mail:
