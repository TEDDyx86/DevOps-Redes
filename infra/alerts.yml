groups:
  - name: trafego-laboratorio
    rules:
      - alert: TrafegoAnormal
        expr: security_traffic_anomaly{job="platform"} == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Tráfego acima da referência: {{ $labels.service }}'
          description: O volume do último minuto excede o maior valor entre três vezes a referência fixa e o piso do serviço há 30 segundos. Confira o teste de carga e o padrão de uso; aumento de volume não comprova um ataque.
      - alert: TrafegoColetaIndisponivel
        expr: security_traffic_sample_success{job="platform"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Coleta de tráfego indisponível: {{ $labels.service }}'
          description: Não foi possível medir uma taxa com sonda e fonte recentes por 30 segundos. O volume está desconhecido, não normal.
  - name: autenticacao-laboratorio
    rules:
      - alert: AutenticacaoSuspeita
        expr: (max(security_auth_failures_recent{job="platform",scope="ip"}) >= 5) or (max(security_auth_failures_recent{job="platform",scope="account"}) >= 10)
        for: 10s
        labels:
          severity: warning
          service: platform
        annotations:
          summary: Tentativas repetidas de acesso ao painel
          description: O limite de falhas de autenticação foi atingido na janela de 60 segundos. Novos logins recebem bloqueio temporário; confira os eventos na aba Segurança.
  - name: smtp-laboratorio
    rules:
      - alert: SMTPIndisponivel
        expr: smtp_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: smtp
        annotations:
          summary: SMTP indisponível
          description: EHLO ou NOOP falhou por 15 segundos. Verifique o container smtp. O canal de alertas usa outro receptor.
      - alert: SMTPFilaElevada
        expr: smtp_queue_messages{job="smtp"} >= 5
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: SMTP com mensagens pendentes na fila
          description: Pelo menos 5 mensagens aguardam entrega há 30 segundos. Verifique smtp-inbox e retome o receptor para esvaziar a fila.
      - alert: SMTPLento
        expr: (smtp_probe_duration_seconds{job="platform"} > 0.5) and (smtp_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: SMTP com resposta lenta
          description: EHLO e NOOP excederam 500 ms por pelo menos 30 segundos.
      - alert: SMTPEstatisticasIndisponiveis
        expr: (up{job="smtp"} == 0) and on() (smtp_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: Estatísticas SMTP indisponíveis
          description: SMTP responde, mas a coleta da fila ou o worker de entrega falhou. Verifique o container smtp.
  - name: dns-laboratorio
    rules:
      - alert: DNSIndisponivel
        expr: dns_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: dns
        annotations:
          summary: DNS indisponível ou resposta incorreta
          description: O registro esperado falhou em UDP ou TCP por pelo menos 15 segundos. Verifique CoreDNS e a zona aularedes.test.
      - alert: DNSLento
        expr: (dns_probe_duration_seconds{job="platform"} > 0.1) and (dns_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: dns
        annotations:
          summary: Resolução DNS lenta
          description: A maior latência das sondas UDP/TCP ultrapassou 100 ms por pelo menos 30 segundos.
      - alert: DNSErrosElevados
        expr: sum(rate(coredns_dns_responses_total{job="dns",rcode=~"SERVFAIL|REFUSED|FORMERR|NOTIMP"}[1m])) / sum(rate(coredns_dns_responses_total{job="dns"}[1m])) > 0.1
        for: 30s
        labels:
          severity: warning
          service: dns
        annotations:
          summary: DNS com erros de servidor elevados
          description: Mais de 10% das respostas são erros de servidor há pelo menos 30 segundos. NXDOMAIN é acompanhado separadamente.
  - name: http-laboratorio
    rules:
      - alert: HTTPIndisponivel
        expr: probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: web-demo
        annotations:
          summary: Aplicação HTTP indisponível
          description: A sonda HTTP falhou por pelo menos 15 segundos. Verifique o modo do laboratório e a resposta de /health.
      - alert: HTTPLento
        expr: (probe_duration_seconds{job="platform"} > 0.5) and (probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: web-demo
        annotations:
          summary: Aplicação HTTP com resposta lenta
          description: A sonda HTTP ultrapassou 500 ms por pelo menos 30 segundos.
      - alert: ColetaIndisponivel
        expr: up{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: Coleta da plataforma interrompida
          description: Prometheus não consegue coletar a sonda da plataforma. A disponibilidade do serviço está desconhecida.
  - name: postgres-laboratorio
    rules:
      - alert: PostgreSQLLento
        expr: (postgres_probe_duration_seconds{job="platform"} > 0.5) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: PostgreSQL com conexão e consulta lentas
          description: A conexão e SELECT 1 excederam 500 ms por pelo menos 30 segundos. Investigue latência e recursos do banco.
      - alert: PostgreSQLIndisponivel
        expr: postgres_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: PostgreSQL indisponível
          description: A conexão SQL e SELECT 1 falharam por pelo menos 15 segundos. Verifique o container postgres e suas credenciais.
      - alert: PostgreSQLConexoesElevadas
        expr: (postgres_connections{job="platform"} / postgres_connections_limit{job="platform"} > 0.8) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: PostgreSQL com muitas conexões
          description: O banco de laboratório ocupa mais de 80% do max_connections do cluster dedicado há pelo menos 30 segundos.
      - alert: PostgreSQLEstatisticasIndisponiveis
        expr: (postgres_stats_success{job="platform"} == 0) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: Estatísticas do PostgreSQL indisponíveis
          description: SQL responde, mas a consulta de estatísticas falha. Verifique pg_stat_statements e o papel de monitoramento.
