groups:
  - name: vulnerabilidades-laboratorio
    rules:
      - alert: VulnerabilidadeCritica
        expr: security_vulnerability_findings{job="platform",severity="critical"} > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Vulnerabilidade crítica na imagem: {{ $labels.service }}'
          description: A análise válida identificou ao menos um achado crítico na imagem do serviço. Revise pacote, versão e correção na aba Segurança. Uma resolução do alerta sem análise atual não comprova correção.
      - alert: VulnerabilidadeAlta
        expr: (security_vulnerability_findings{job="platform",severity="high"} > 0) and on(service) (security_vulnerability_findings{job="platform",severity="critical"} == 0)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Vulnerabilidade alta na imagem: {{ $labels.service }}'
          description: A análise válida identificou achados altos sem achados críticos na imagem do serviço. Confira aplicabilidade e correções. Uma resolução do alerta sem análise atual não comprova correção.
      - alert: VulnerabilidadeAnaliseIndisponivel
        expr: security_vulnerability_analysis_success{job="platform"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Análise de vulnerabilidades indisponível: {{ $labels.service }}'
          description: Não há análise atual válida para a imagem observada há pelo menos 2 minutos. Verifique o processo local, rede, inventário, validade da base e relatório. Não significa ausência de vulnerabilidades.
  - name: configuracoes-laboratorio
    rules:
      - alert: ConfiguracaoAlterada
        expr: security_config_changed{job="platform"} == 1
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: 'Configuração alterada ou ausente: {{ $labels.file_id }}'
          description: O arquivo difere da referência aprovada ou está ausente há pelo menos 15 segundos. Revise o repositório antes de aprovar uma nova referência.
      - alert: ConfiguracaoVerificacaoIndisponivel
        expr: security_config_check_success{job="platform"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Verificação de configuração indisponível: {{ $labels.file_id }}'
          description: Leitura indisponível ou observação sem atualização há pelo menos 30 segundos. A integridade do arquivo é desconhecida.
      - alert: ConfiguracaoReferenciaPendente
        expr: (security_config_baseline_ready{job="platform"} == 0) and (security_config_readable{job="platform"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Referência de configuração pendente: {{ $labels.file_id }}'
          description: Arquivo legível sem referência aprovada por pelo menos 2 minutos. Confira seu conteúdo no repositório e aprove o hash na aba Segurança.
  - name: trafego-laboratorio
    rules:
      - alert: TrafegoAnormal
        expr: security_traffic_anomaly{job="platform"} == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Tráfego acima da referência: {{ $labels.service }}'
          description: O volume do último minuto excede o maior valor entre três vezes a referência fixa e o piso do serviço há 30 segundos. Confira o teste de carga e o padrão de uso; aumento de volume não comprova um ataque.
      - alert: TrafegoColetaIndisponivel
        expr: security_traffic_sample_success{job="platform"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Coleta de tráfego indisponível: {{ $labels.service }}'
          description: Não foi possível medir uma taxa com sonda e fonte recentes por 30 segundos. O volume está desconhecido, não normal.
  - name: autenticacao-laboratorio
    rules:
      - alert: AutenticacaoSuspeita
        expr: (max(security_auth_failures_recent{job="platform",scope="ip"}) >= 5) or (max(security_auth_failures_recent{job="platform",scope="account"}) >= 10)
        for: 10s
        labels:
          severity: warning
          service: platform
        annotations:
          summary: Tentativas repetidas de acesso ao painel
          description: O limite de falhas de autenticação foi atingido na janela de 60 segundos. Novos logins recebem bloqueio temporário; confira os eventos na aba Segurança.
  - name: smtp-laboratorio
    rules:
      - alert: SMTPIndisponivel
        expr: smtp_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: smtp
        annotations:
          summary: SMTP indisponível
          description: EHLO ou NOOP falhou por 15 segundos. Verifique o container smtp. O canal de alertas usa outro receptor.
      - alert: SMTPFilaElevada
        expr: smtp_queue_messages{job="smtp"} >= 5
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: SMTP com mensagens pendentes na fila
          description: Pelo menos 5 mensagens aguardam entrega há 30 segundos. Verifique smtp-inbox e retome o receptor para esvaziar a fila.
      - alert: SMTPLento
        expr: (smtp_probe_duration_seconds{job="platform"} > 0.5) and (smtp_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: SMTP com resposta lenta
          description: EHLO e NOOP excederam 500 ms por pelo menos 30 segundos.
      - alert: SMTPEstatisticasIndisponiveis
        expr: (up{job="smtp"} == 0) and on() (smtp_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: smtp
        annotations:
          summary: Estatísticas SMTP indisponíveis
          description: SMTP responde, mas a coleta da fila ou o worker de entrega falhou. Verifique o container smtp.
  - name: dns-laboratorio
    rules:
      - alert: DNSIndisponivel
        expr: dns_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: dns
        annotations:
          summary: DNS indisponível ou resposta incorreta
          description: O registro esperado falhou em UDP ou TCP por pelo menos 15 segundos. Verifique CoreDNS e a zona aularedes.test.
      - alert: DNSLento
        expr: (dns_probe_duration_seconds{job="platform"} > 0.1) and (dns_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: dns
        annotations:
          summary: Resolução DNS lenta
          description: A maior latência das sondas UDP/TCP ultrapassou 100 ms por pelo menos 30 segundos.
      - alert: DNSErrosElevados
        expr: sum(rate(coredns_dns_responses_total{job="dns",rcode=~"SERVFAIL|REFUSED|FORMERR|NOTIMP"}[1m])) / sum(rate(coredns_dns_responses_total{job="dns"}[1m])) > 0.1
        for: 30s
        labels:
          severity: warning
          service: dns
        annotations:
          summary: DNS com erros de servidor elevados
          description: Mais de 10% das respostas são erros de servidor há pelo menos 30 segundos. NXDOMAIN é acompanhado separadamente.
  - name: http-laboratorio
    rules:
      - alert: HTTPIndisponivel
        expr: probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: web-demo
        annotations:
          summary: Aplicação HTTP indisponível
          description: A sonda HTTP falhou por pelo menos 15 segundos. Verifique o modo do laboratório e a resposta de /health.
      - alert: HTTPLento
        expr: (probe_duration_seconds{job="platform"} > 0.5) and (probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: web-demo
        annotations:
          summary: Aplicação HTTP com resposta lenta
          description: A sonda HTTP ultrapassou 500 ms por pelo menos 30 segundos.
      - alert: ColetaIndisponivel
        expr: up{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: Coleta da plataforma interrompida
          description: Prometheus não consegue coletar a sonda da plataforma. A disponibilidade do serviço está desconhecida.
  - name: postgres-laboratorio
    rules:
      - alert: PostgreSQLLento
        expr: (postgres_probe_duration_seconds{job="platform"} > 0.5) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: PostgreSQL com conexão e consulta lentas
          description: A conexão e SELECT 1 excederam 500 ms por pelo menos 30 segundos. Investigue latência e recursos do banco.
      - alert: PostgreSQLIndisponivel
        expr: postgres_probe_success{job="platform"} == 0
        for: 15s
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: PostgreSQL indisponível
          description: A conexão SQL e SELECT 1 falharam por pelo menos 15 segundos. Verifique o container postgres e suas credenciais.
      - alert: PostgreSQLConexoesElevadas
        expr: (postgres_connections{job="platform"} / postgres_connections_limit{job="platform"} > 0.8) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: PostgreSQL com muitas conexões
          description: O banco de laboratório ocupa mais de 80% do max_connections do cluster dedicado há pelo menos 30 segundos.
      - alert: PostgreSQLEstatisticasIndisponiveis
        expr: (postgres_stats_success{job="platform"} == 0) and (postgres_probe_success{job="platform"} == 1)
        for: 30s
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: Estatísticas do PostgreSQL indisponíveis
          description: SQL responde, mas a consulta de estatísticas falha. Verifique pg_stat_statements e o papel de monitoramento.
  - name: recursos-laboratorio
    rules:
      - alert: RecursoCPUElevada
        expr: (service_resource_cpu_cores{job="platform"} > on(service) service_resource_budget_cpu_cores{job="platform"}) and on(service) (service_resource_metric_available{job="platform",metric="cpu_cores"} == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Uso elevado de CPU: {{ $labels.service }}'
          description: O contêiner excede o orçamento de 0,8 núcleo por 30 s. Um núcleo equivale a 1,0; não é percentual do host. Investigue a carga. Resolução sem coleta atual não comprova normalização.
      - alert: RecursoMemoriaElevada
        expr: (service_resource_memory_bytes{job="platform"} > on(service) service_resource_budget_memory_bytes{job="platform"}) and on(service) (service_resource_metric_available{job="platform",metric="memory_bytes"} == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Memória acima do orçamento: {{ $labels.service }}'
          description: 'Working set acima do orçamento didático por 30 s: 128 MiB, ou 256 MiB para PostgreSQL. Não representa o limite compartilhado da VM. Resolução sem coleta atual não comprova normalização.'
      - alert: RecursoIOElevado
        expr: ((service_resource_read_bps{job="platform"} + on(service) service_resource_write_bps{job="platform"}) > on(service) service_resource_budget_io_bps{job="platform"}) and on(service) (service_resource_metric_available{job="platform",metric="read_bps"} == 1) and on(service) (service_resource_metric_available{job="platform",metric="write_bps"} == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Movimentação de blocos elevada: {{ $labels.service }}'
          description: 'Leitura mais gravação excedem 10 MiB/s por 30 s. É movimentação contabilizada pelo Engine, não ocupação nem latência de disco. Resolução sem coleta atual não comprova normalização.'
      - alert: RecursosColetaIndisponivel
        expr: (service_resource_collection_success{job="platform"} == 0) and on() (service_resource_monitor_enabled == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Coleta de recursos indisponível: {{ $labels.service }}'
          description: 'Sem snapshot válido de recursos por 30 s. Confira o coletor local e o Docker. CPU, memória e I/O estão desconhecidos; as sondas dos protocolos são independentes.'
