global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: platform
    static_configs:
      - targets: [api:8000]
  - job_name: web-demo
    static_configs:
      - targets: [web-demo:8001]
