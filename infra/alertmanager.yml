global:
  resolve_timeout: 30s
  smtp_smarthost: mailpit:1025
  smtp_from: monitor@aularedes.test
  smtp_require_tls: false
route:
  receiver: laboratorio
  group_by: [alertname, service]
  group_wait: 0s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: laboratorio
    email_configs:
      - to: aluno@aularedes.test
        send_resolved: true
        headers:
          Subject: '[AulaRedes] {{ .Status }}: {{ .CommonAnnotations.summary }}'
    webhook_configs:
      - url: http://api:8000/api/webhooks/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/aularedes/webhook-token
